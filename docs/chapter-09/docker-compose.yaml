  embedding-inference:
    container_name: embedding-inference
    image:  yevai/codebase-index-embed:sm120-cu131-v1
    env_file:
      - ../../codebase-indexing/.env
    depends_on:
      - db-vector
    profiles: ["codebase-indexing", "qwen36-a3b-swarm", "qwen36-a3b-hive", "qwen36-a3b-assistant"]
    cpuset: "16-21"
    restart: "no"
    labels:
      - "ephemeral=true"
      - "persistence=none"
    runtime: nvidia
    pid: host
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ${HF_CACHE_DIR}:/data
    command:
      - --model-id
      - ${EMBEDDING_MODEL_PATH}
      - --pooling
      - last-token
      - --auto-truncate
      - --dtype
      - "float16"
      - --tokenization-workers
      - "2"
      - --max-client-batch-size
      - "${MAX_CLIENT_BATCH_SIZE:-64}"
      - --max-batch-tokens
      - "${MAX_BATCH_TOKENS:-8192}"
  embedding-manager:
    container_name: embedding-manager
    image: yevai/codebase-index-rerank:sm120-cu131-v1
    env_file:
      - ../../codebase-indexing/.env
    depends_on:
      - embedding-inference
      - db-vector
    profiles: ["codebase-indexing", "qwen36-a3b-swarm", "qwen36-a3b-hive", "qwen36-a3b-assistant"]
    cpuset: "22-27"
    restart: "no"
    labels:
      - "ephemeral=true"
      - "persistence=none"
    runtime: nvidia
    pid: host
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ports:
      - "1335:8000"
    volumes:
      - ${HF_CACHE_DIR}:/data
    environment:
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      - OMP_NUM_THREADS=6
      - MKL_NUM_THREADS=6
      - RERANK_BATCH_SIZE=32
      - TEI_BASE_URL=${TEI_BASE_URL}
      - MODEL_PATH=${RERANKER_MODEL_PATH}
      - PORT=8000
      - HF_HUB_OFFLINE=1
  db-vector:
    image: qdrant/qdrant:latest
    profiles: ["codebase-indexing", "qwen36-a3b-swarm", "qwen36-a3b-hive", "qwen36-a3b-assistant"]
    container_name: db-vector
    ports:
      - "6333:6333"
      - "6334:6334"
    labels:
      - "ephemeral=false"
      - "persistence=hfs"
    volumes:
      - ${HOME}/.qdrant_data:/qdrant/storage