services:
  qwen36-a3b-swarm-inference:
    container_name: inference-model
    image: yevai/local-inference-qwen36:sm120-cu132-v4
    profiles: ["qwen36-a3b-swarm-only", "qwen36-a3b-swarm"]
    env_file:
      - ../../codebase-indexing/.env
    cpuset: "0-15"
    pid: host
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    labels:
      - "ephemeral=true"
      - "persistence=none"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/v1/models || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s
    shm_size: '16gb'
    ports:
      - "1337:8000"
    volumes:
      - ${HF_CACHE_DIR}:/root/.cache/huggingface
      - ${HOME}/.cache/vllm:/root/.cache/vllm
    environment:
      - VLLM_USE_FLASHINFER_MOE_FP4=1
      - VLLM_USE_FLASHINFER_MOE_FP8=1
      - VLLM_NVFP4_GEMM_BACKEND=cutlass
      - OMP_NUM_THREADS=16
      - MKL_NUM_THREADS=16
      - DG_JIT_USE_NVRTC=1
      - VLLM_NO_USAGE_STATS=1
      - CUDA_DEVICE_MAX_CONNECTIONS=1
      - NCCL_P2P_DISABLE=1
      - SAFETENSORS_FAST_GPU=1
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      - TRITON_PTXAS_PATH=/usr/local/cuda/bin/ptxas
      - LD_LIBRARY_PATH=/usr/local/nvidia/lib64:/usr/local/cuda/lib64
      - HF_TOKEN=${HF_TOKEN}
    command:
      - --model
      - sakamakismile/Huihui-Qwen3.6-35B-A3B-Claude-4.7-Opus-abliterated-NVFP4
      - --max-model-len
      - "131072"
      - --max-num-seqs
      - "5"
      - --gpu-memory-utilization
      - "0.89" # Bump this up if you are uncomfortable with discomfort and/or enjoy wasting precious VRAM
      - --optimization-level
      - "3"
      - --kv-cache-dtype
      - fp8_e4m3
      - --calculate-kv-scales
      - --performance-mode
      - throughput
      - --enable-prefix-caching # This is slower on benchmarks but faster in real-world LM code harness usage
      - --compilation-config
      - '{"cudagraph_mode": "FULL_AND_PIECEWISE", "cache_dir": "/root/.cache/vllm", "cudagraph_capture_sizes": [1, 2, 3, 4, 5], "max_cudagraph_capture_size": 5, "pass_config": {"fuse_norm_quant": true, "fuse_act_quant": true}}'
      - --language-model-only
      - --reasoning-parser
      - qwen3
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_coder
      - --max-num-batched-tokens
      - "16384"
      - --port
      - "8000"
      - --host
      - 0.0.0.0
